name: Native development bundle
on:
  workflow_dispatch:
    inputs:
      notarize:
        description: Sign with Developer ID and submit to Apple for notarization
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 65
    env:
      SDL_VIDEODRIVER: dummy
      TEXPRESSO_TEST_TECTONIC: '0'
      TEXPRESSO_TEST_PREVIEW: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check native profile contracts
        run: python3 -m unittest discover -s native/tests
      - name: Read locked MuPDF revision
        id: inputs
        run: |
          python3 - <<'PY'
          import json, os
          lock = json.load(open('native/dependencies.lock.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('mupdf=' + lock['mupdf']['revision'] + '\n')
          PY
      - name: Restore local dependency source cache
        uses: actions/cache@v4
        with:
          path: .native-sources/mupdf
          key: native-mupdf-${{ steps.inputs.outputs.mupdf }}
      - uses: actions/checkout@v4
        with:
          repository: ArtifexSoftware/mupdf
          ref: ${{ steps.inputs.outputs.mupdf }}
          path: .native-sources/mupdf
          persist-credentials: false
      - name: Initialize only the required MuPDF submodule
        run: git -C .native-sources/mupdf submodule update --init --depth 1 thirdparty/lcms2
      - name: Cache Homebrew downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: native-brew-${{ runner.arch }}-${{ hashFiles('native/dependencies.lock.json', 'native/profiles/*', '.github/workflows/native-build.yml') }}
      - name: Install development build libraries on the runner
        run: brew install pkgconf freetype jpeg-turbo openjpeg brotli sdl2 harfbuzz graphite2 fontconfig libpng jbig2dec icu4c@78
      - name: Build and relocate the native bundle
        run: python3 native/scripts/build.py --mupdf-source .native-sources/mupdf --icu-prefix "$(brew --prefix icu4c@78)" --output native/.bundles/macos
      - name: Compare filtered ICU with stock ICU
        run: python3 native/scripts/verify_icu.py --icu-prefix "$(brew --prefix icu4c@78)"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install local test provider on the runner
        run: |
          brew install --cask basictex
          sudo /Library/TeX/texbin/tlmgr install geometry amsmath hyperref xcolor
      - name: Test the bundle with TeX Live
        run: |
          export PATH="/Library/TeX/texbin:$PATH"
          export TEXPRESSO_BINARY="$PWD/native/.bundles/macos/bin/texpresso"
          npm run test:engine
        timeout-minutes: 8
      - name: Sign and notarize the tested bundle
        id: notarize
        if: inputs.notarize
        timeout-minutes: 25
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: >-
          python3 native/scripts/notarize.py
          --bundle native/.bundles/macos
          --output native/.bundles/macos-signed
          --reports native/.bundles/notarization
      - name: Test the Developer ID signed bundle
        if: inputs.notarize
        run: |
          export PATH="/Library/TeX/texbin:$PATH"
          export TEXPRESSO_BINARY="$PWD/native/.bundles/macos-signed/bin/texpresso"
          npm run test:engine
        timeout-minutes: 8
      - name: Save accepted signed bundle
        if: success() && inputs.notarize
        uses: actions/upload-artifact@v4
        with:
          name: native-macos-${{ runner.arch }}-notarized
          path: |
            native/.bundles/macos-signed.zip
            native/.bundles/macos-signed.zip.sha256
            native/.bundles/macos-signed/build-manifest.json
            native/.bundles/notarization/
          if-no-files-found: error
          retention-days: 14
      - name: Clean up signing credentials even after cancellation
        if: always() && inputs.notarize
        run: |
          python3 - <<'PY'
          import os, pathlib, shutil, subprocess
          for folder in pathlib.Path(os.environ['RUNNER_TEMP']).glob('texpresso-sign-*'):
              subprocess.run(['security', 'delete-keychain', str(folder / 'signing.keychain-db')],
                             stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              shutil.rmtree(folder)
          PY
      - name: Save development bundle and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-macos-${{ runner.arch }}
          path: |
            native/.bundles/macos.zip
            native/.bundles/macos/build-manifest.json
            native/.bundles/notarization/
            artifacts/
          if-no-files-found: ignore
          retention-days: 14
