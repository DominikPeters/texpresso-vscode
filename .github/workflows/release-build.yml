name: Release candidate artifacts
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    uses: ./.github/workflows/native-build.yml
    with:
      notarize: true
    secrets: inherit
  linux:
    uses: ./.github/workflows/linux-build.yml
  universal:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Collect and verify extension corresponding sources
        run: |
          python3 native/scripts/release_sources.py --fetch
          python3 native/scripts/verify_sources.py artifacts --target universal
      - name: Install latest stable packaging tool
        run: |
          npm install --global @vscode/vsce@latest
          vsce --version
      - name: Package and test the universal fallback
        run: |
          xvfb-run -a npm run test:package
          mv artifacts/texpresso.vsix artifacts/texpresso-universal.vsix
          sha256sum artifacts/texpresso-universal.vsix > artifacts/texpresso-universal.vsix.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: sources-universal
          path: artifacts/*sources-universal.tar.gz*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: vsix-universal
          path: |
            artifacts/texpresso-universal.vsix
            artifacts/texpresso-universal.vsix.sha256
          if-no-files-found: error
          retention-days: 14
  verify:
    needs: [macos, linux, universal]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: vsix-*
          merge-multiple: true
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          pattern: sources-*
          merge-multiple: true
          path: artifacts
      - name: Verify complete release and corresponding source coverage
        run: |
          python3 native/scripts/verify_sources.py artifacts
          node scripts/verify-release.cjs artifacts
