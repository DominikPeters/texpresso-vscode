<!doctype html><meta charset="utf-8"><title>SVG renderer validation</title>
<style>body{font:13px system-ui;background:#222;color:#ddd}#sample{width:800px;background:white}#sample>svg{display:block;width:100%;height:auto}</style>
<h1>SVG renderer validation</h1><button id="start">Run validation</button> <span id="status">Ready</span><pre id="results"></pre><div id="sample"></div>
<script src="/preview-svg.js"></script><script>
const element=id=>document.getElementById(id), NS='http://www.w3.org/2000/svg', XL='http://www.w3.org/1999/xlink', results=[];
const svg=body=>`<svg xmlns="${NS}" xmlns:xlink="${XL}" width="100" height="100" viewBox="0 0 100 100">${body}</svg>`;
const assert=(ok,message)=>{if(!ok)throw Error(message);};
function canonical(page){
 const walk=node=>[node.namespaceURI,node.localName,[...node.attributes].filter(a=>a.namespaceURI!=='http://www.w3.org/2000/xmlns/').map(a=>{
  let value=a.value;if(a.localName==='id')value=value.slice(page.scope.length);else if(a.localName==='href')value='#'+value.slice(1+page.scope.length);else if(value.startsWith('url(#'+page.scope))value='url(#'+value.slice(5+page.scope.length);
  return [a.namespaceURI,a.localName,value];}).sort(),[...node.children].map(walk)];return JSON.stringify(walk(page.root));
}
async function pixels(xml){
 const blob=new Blob([xml],{type:'image/svg+xml'}),url=URL.createObjectURL(blob),image=new Image();image.src=url;await image.decode();
 const canvas=document.createElement('canvas');canvas.width=800;canvas.height=Math.round(800*image.naturalHeight/image.naturalWidth);const ctx=canvas.getContext('2d',{willReadFrequently:true});ctx.drawImage(image,0,0,canvas.width,canvas.height);URL.revokeObjectURL(url);return ctx.getImageData(0,0,canvas.width,canvas.height).data;
}
async function check(name,fn){await fn();results.push(name);element('results').textContent+=name+' — PASS\n';}
element('start').onclick=async()=>{
 element('start').disabled=true;
 try{
 await check('Reject active, external and unsupported SVG',()=>{
  const bad=['<script>alert(1)<'+ '/script>','<foreignObject/>','<image href="data:image/png;base64,AA=="/>','<path onclick="alert(1)"/>','<g style="fill:red"/>','<use href="https://example.com/x"/>','<use href="data:image/svg+xml,x"/>','<path fill="url(https://example.com/x)"/>','<use href="#missing"/>','<path id="a"/><path id="a"/>','<text>hello</text>'];
  for(const body of bad)assert(!TexpressoSvgPage.create(svg(body),'bad'),'Accepted unsupported body '+body);
  assert(!TexpressoSvgPage.create('<!DOCTYPE svg><svg xmlns="'+NS+'"/>','bad'),'Accepted DTD');
 });
 await check('Scoped definitions, clipping and magnifier references',async()=>{
  const page=TexpressoSvgPage.create(svg('<defs><path id="image" d="M0 0L80 80"/><clipPath id="clip"><rect width="50" height="50"/></clipPath></defs><g clip-path="url(#clip)"><use xlink:href="#image" stroke="#ff0000"/></g>'),'clipped');assert(page,'Clip rejected');
  const clone=page.clone(), ids=new Set([...page.root.querySelectorAll('[id]')].map(n=>n.id));for(const n of clone.querySelectorAll('[id]'))assert(!ids.has(n.id),'Magnifier ID collision');
  assert(!page.root.querySelector('#image'),'Unscoped ID');
  const a=await pixels(new XMLSerializer().serializeToString(page.root)),b=await pixels(new XMLSerializer().serializeToString(clone));assert(a.length===b.length&&!a.some((v,i)=>v!==b[i]),'Magnifier clone rendered differently');
 });
 await check('Adjacent splices and transactional patch rejection',()=>{
  const page=TexpressoSvgPage.create(svg('<path d="M1 1L2 2"/><path d="M3 3L4 4"/><path d="M5 5L6 6"/>'),'a');
  page.patch({base:'a',operations:[{path:[],start:1,remove:1,xml:'<path d="M7 7L8 8"/>'},{path:[],start:0,remove:1,xml:'<path d="M9 9L10 10"/>'}]},'b');
  assert(page.root.children[0].getAttribute('d')==='M9 9L10 10','First adjacent splice');assert(page.root.children[1].getAttribute('d')==='M7 7L8 8','Second adjacent splice');
  const inert=TexpressoSvgPage.create(svg('<path data-text="url(#missing)" d="M1 1"/>'),'inert');const metadata='url(#'+inert.scope+'fake)';inert.root.firstElementChild.setAttribute('data-text',metadata);assert(inert.clone().firstElementChild.getAttribute('data-text')===metadata,'Inert metadata changed');inert.patch({base:'inert',operations:[{path:[],start:0,remove:1,xml:'<path d="M2 2"/>'}]},'after');
  const before=canonical(page);
  for(const patch of [{base:'wrong',operations:[]},{base:'b',operations:[{path:[],start:0,remove:1,xml:'<use href="#missing"/>'}]},{base:'b',operations:[{path:[],start:0,remove:1,xml:'<path/>'},{path:[],start:0,remove:1,xml:'<path/>'}]}]){
   let threw=false;try{page.patch(patch,'bad');}catch{threw=true;}assert(threw,'Invalid patch accepted');assert(canonical(page)===before,'Failed patch mutated DOM');
  }
 });
 for(const job of await fetch('/validation.json').then(r=>r.json())){
  await check(job.kind+' '+job.edit+' structural reuse and exact rendering',async()=>{
   let page=TexpressoSvgPage.create(job.before,'before'), expected=TexpressoSvgPage.create(job.after,'after');assert(page&&expected,'Fixture rejected');
   const oldRoot=page.root,oldNodes=new Set(page.root.querySelectorAll('*'));
   if(job.patch)page.patch(job.patch,'after');else page=expected;
   assert(canonical(page)===canonical(expected),'Patched tree differs');
   if(job.patch){assert(page.root===oldRoot,'Root replaced');const retained=[...page.root.querySelectorAll('*')].filter(n=>oldNodes.has(n)).length;assert(retained>oldNodes.size*.8,'Too little node reuse');}
   const actualPixels=await pixels(new XMLSerializer().serializeToString(page.root)),fullPixels=await pixels(job.originalAfter);assert(actualPixels.length===fullPixels.length&&!actualPixels.some((v,i)=>v!==fullPixels[i]),'Rendered pixels differ');
   element('sample').replaceChildren(page.root);
  });
 }
 await fetch('/validation-result',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({passed:results,ua:navigator.userAgent,dpr:devicePixelRatio})});element('status').textContent=results.length+' checks passed';document.title='SVG renderer validation passed';
 }catch(error){element('status').textContent=error.stack;}
};
</script>
